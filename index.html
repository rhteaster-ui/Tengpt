<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rhmt Labs • Chat Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #0f172a;
      --brand-soft: #1e293b;
      --primary: #2563eb;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      padding: 14px;
      border-radius: var(--radius);
      background: linear-gradient(140deg, var(--brand), var(--brand-soft));
      color: white;
    }

    .brand h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .brand p {
      margin: 6px 0 0;
      opacity: 0.8;
      font-size: 12px;
    }

    .menu {
      display: grid;
      gap: 8px;
    }

    .menu button,
    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      min-height: 38px;
      padding: 0 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .menu button.active {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }

    .btn.primary {
      background: var(--primary);
      color: white;
      border-color: transparent;
    }

    .main {
      padding: 20px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header h2 {
      margin: 0;
      font-size: 18px;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .history-content {
      padding: 12px;
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 220px);
      overflow: auto;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface-soft);
      cursor: pointer;
    }

    .history-item h3 {
      margin: 0;
      font-size: 14px;
    }

    .history-item p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .chat-view {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 40px);
    }

    .chat-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
      display: grid;
      gap: 12px;
      background: var(--surface-soft);
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .message {
      max-width: min(780px, 92%);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      background: var(--surface);
      justify-self: start;
    }

    .message.user {
      justify-self: end;
      background: #1e293b;
      border-color: #1e293b;
      color: #f8fafc;
    }

    .message img {
      display: block;
      max-width: 100%;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: grid;
      gap: 10px;
      background: var(--surface);
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      background: #e2e8f0;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb button {
      position: absolute;
      top: 4px;
      right: 4px;
      border: none;
      background: rgba(15, 23, 42, 0.85);
      color: white;
      border-radius: 999px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    textarea,
    select {
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      color: var(--text);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 46px;
      max-height: 160px;
      padding: 10px 12px;
      line-height: 1.4;
    }

    select {
      height: 38px;
      padding: 0 10px;
      background: var(--surface);
    }

    .upload {
      display: none;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 18px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      background: white;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .main {
        padding: 14px;
      }

      .chat-view {
        min-height: auto;
      }

      .chat-body {
        max-height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>rhmt Labs</h1>
        <p>Simple AI Workspace</p>
      </div>

      <div class="menu">
        <button id="chatTab" class="active">Halaman Chat</button>
        <button id="historyTab">Halaman Histori</button>
        <button id="newChatBtn" class="btn primary">+ Chat Baru</button>
      </div>
    </aside>

    <main class="main">
      <section id="chatPage" class="panel chat-view">
        <div class="header">
          <div>
            <h2>Chat</h2>
            <p>Kirim pertanyaan dan upload foto dengan tampilan sederhana.</p>
          </div>
          <select id="modelSelect">
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro</option>
            <option value="gemini-2.0-flash">gemini-2.0-flash</option>
          </select>
        </div>

        <div class="chat-body" id="chatBody"></div>

        <div class="composer">
          <div class="preview-grid" id="preview"></div>
          <div class="row">
            <label class="btn" for="fileInput">Upload Foto</label>
            <input id="fileInput" class="upload" type="file" accept="image/*" multiple />
            <textarea id="prompt" placeholder="Tulis pesan... (Enter kirim, Shift+Enter baris baru)"></textarea>
            <button id="sendBtn" class="btn primary">Kirim</button>
          </div>
        </div>
      </section>

      <section id="historyPage" class="panel hidden">
        <div class="header">
          <div>
            <h2>Histori Chat</h2>
            <p>Pilih percakapan untuk dilanjutkan dari daftar histori.</p>
          </div>
        </div>
        <div class="history-content" id="historyList"></div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      chats: [],
      currentChatId: null,
      pendingImages: [],
      sending: false,
      page: 'chat'
    };

    const el = {
      chatTab: document.getElementById('chatTab'),
      historyTab: document.getElementById('historyTab'),
      chatPage: document.getElementById('chatPage'),
      historyPage: document.getElementById('historyPage'),
      newChatBtn: document.getElementById('newChatBtn'),
      chatBody: document.getElementById('chatBody'),
      historyList: document.getElementById('historyList'),
      modelSelect: document.getElementById('modelSelect'),
      fileInput: document.getElementById('fileInput'),
      preview: document.getElementById('preview'),
      prompt: document.getElementById('prompt'),
      sendBtn: document.getElementById('sendBtn')
    };

    const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;

    function save() {
      localStorage.setItem('rhmt_labs_state_v1', JSON.stringify({
        chats: state.chats,
        currentChatId: state.currentChatId,
      }));
    }

    function load() {
      const raw = localStorage.getItem('rhmt_labs_state_v1');
      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);
        state.chats = Array.isArray(parsed.chats) ? parsed.chats : [];
        state.currentChatId = parsed.currentChatId || null;
      } catch (error) {
        console.warn('Gagal membaca state lokal:', error);
      }
    }

    function getCurrentChat() {
      return state.chats.find(chat => chat.id === state.currentChatId) || null;
    }

    function newChat() {
      const chat = {
        id: uid(),
        title: 'Chat Baru',
        updatedAt: Date.now(),
        messages: []
      };

      state.chats.unshift(chat);
      state.currentChatId = chat.id;
      save();
      render();
    }

    function escapeHtml(text = '') {
      return text.replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function setPage(page) {
      state.page = page;
      el.chatPage.classList.toggle('hidden', page !== 'chat');
      el.historyPage.classList.toggle('hidden', page !== 'history');
      el.chatTab.classList.toggle('active', page === 'chat');
      el.historyTab.classList.toggle('active', page === 'history');
    }

    function renderPreview() {
      if (!state.pendingImages.length) {
        el.preview.innerHTML = '';
        return;
      }

      el.preview.innerHTML = state.pendingImages.map((image, index) => `
        <div class="thumb">
          <img src="${image.base64}" alt="preview-${index}" />
          <button data-remove="${index}">×</button>
        </div>
      `).join('');

      el.preview.querySelectorAll('[data-remove]').forEach(button => {
        button.addEventListener('click', () => {
          state.pendingImages.splice(Number(button.dataset.remove), 1);
          renderPreview();
        });
      });
    }

    function renderHistory() {
      if (!state.chats.length) {
        el.historyList.innerHTML = '<div class="empty">Belum ada histori chat.</div>';
        return;
      }

      el.historyList.innerHTML = state.chats.map(chat => {
        const totalMessages = chat.messages.length;
        const date = new Date(chat.updatedAt).toLocaleString('id-ID');
        return `
          <article class="history-item" data-chat-id="${chat.id}">
            <h3>${escapeHtml(chat.title || 'Tanpa Judul')}</h3>
            <p>${totalMessages} pesan • terakhir diperbarui ${date}</p>
          </article>
        `;
      }).join('');

      el.historyList.querySelectorAll('[data-chat-id]').forEach(item => {
        item.addEventListener('click', () => {
          state.currentChatId = item.dataset.chatId;
          setPage('chat');
          save();
          render();
        });
      });
    }

    function renderMessages() {
      const chat = getCurrentChat();
      if (!chat || !chat.messages.length) {
        el.chatBody.innerHTML = '<div class="empty">Mulai percakapan baru di rhmt Labs. Kamu bisa kirim teks dan upload foto.</div>';
        return;
      }

      el.chatBody.innerHTML = chat.messages.map(message => {
        const images = (message.images || []).map(src => `<img src="${src}" alt="message-image" />`).join('');
        return `<div class="message ${message.role === 'user' ? 'user' : ''}">${escapeHtml(message.text || '')}${images}</div>`;
      }).join('');

      el.chatBody.scrollTop = el.chatBody.scrollHeight;
    }

    function render() {
      renderPreview();
      renderMessages();
      renderHistory();
    }

    async function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function sendMessage() {
      if (state.sending) return;

      const text = el.prompt.value.trim();
      const hasImages = state.pendingImages.length > 0;
      if (!text && !hasImages) return;

      const chat = getCurrentChat();
      if (!chat) return;

      const userMessage = {
        role: 'user',
        text,
        images: state.pendingImages.map(image => image.base64),
        createdAt: Date.now()
      };

      chat.messages.push(userMessage);
      if (chat.messages.length === 1) {
        chat.title = text.slice(0, 38) || 'Upload Foto';
      }
      chat.updatedAt = Date.now();

      const queuedImages = [...state.pendingImages];
      state.pendingImages = [];
      el.prompt.value = '';
      state.sending = true;
      el.sendBtn.disabled = true;
      render();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text,
            images: queuedImages.map(image => image.base64),
            model: el.modelSelect.value,
            mode: 'chat',
            history: chat.messages.map(message => ({
              role: message.role,
              text: message.text,
              images: message.images || []
            }))
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || data.reply || 'Permintaan gagal.');
        }

        chat.messages.push({
          role: 'assistant',
          text: data.reply || 'Tidak ada balasan dari model.',
          images: data.images || [],
          createdAt: Date.now()
        });
      } catch (error) {
        chat.messages.push({
          role: 'assistant',
          text: `❌ ${error.message}`,
          images: [],
          createdAt: Date.now()
        });
      } finally {
        state.sending = false;
        el.sendBtn.disabled = false;
        chat.updatedAt = Date.now();
        save();
        render();
      }
    }

    el.chatTab.addEventListener('click', () => setPage('chat'));
    el.historyTab.addEventListener('click', () => setPage('history'));
    el.newChatBtn.addEventListener('click', () => {
      newChat();
      setPage('chat');
    });

    el.fileInput.addEventListener('change', async event => {
      const files = Array.from(event.target.files || []);
      for (const file of files) {
        const base64 = await fileToBase64(file);
        state.pendingImages.push({ name: file.name, base64 });
      }
      event.target.value = '';
      renderPreview();
    });

    el.prompt.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    el.sendBtn.addEventListener('click', sendMessage);

    load();
    if (!state.chats.length) newChat();
    if (!state.currentChatId && state.chats.length) state.currentChatId = state.chats[0].id;
    setPage('chat');
    render();
  </script>
</body>
</html>
